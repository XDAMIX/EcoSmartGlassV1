<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Smart Glass – Démo Réaliste</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .smart-glass-container {
            width: 100%;
            max-width: 900px;
            padding: 200px;

            

        }

        .scene {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);


        }

        .scene img {
            width: 100%;
            height: auto;
            display: block;

        }

        /* 🪟 ZONE EXACTE DU VERRE (PHOTO FOURNIE) */
        /* .glass-overlay {
            position: absolute;
            top: 10%;
            left: 63%;
            width: 30%;
            height: 100%;
            background: rgba(0, 120, 200, 0);
            backdrop-filter: blur(0px);
            transition: background 0.4s ease, backdrop-filter 0.4s ease;
            pointer-events: none;

            clip-path: polygon(0 11%, 100% 25%, 100% 100%, 0 89%);
        } */


        .glass-overlay {
            position: absolute;
            top: 10%;
            left: 20%;
            width: 70%;
            height: 60%;

            background: rgba(0, 120, 200, 0);
            backdrop-filter: blur(0px);

            /* 🪟 FORME EXACTE DU VITRAGE */

            transition: background 0.4s ease, backdrop-filter 0.4s ease;
            pointer-events: none;

            clip-path: polygon(3% 10%,
                    79.5% 0%,
                    79.5% 100%,
                    3% 96%);


        }


        .controls {
            margin-top: 20px;
            text-align: center;
        }

        .temperature {
            font-size: clamp(22px, 4vw, 32px);
            font-weight: bold;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }

        input[type="range"] {
            width: 100%;
            max-width: 500px;
        }

        /* 📱 TABLETTE */
        @media (max-width: 900px) {
            .glass-overlay {
                left: 60%;
                width: 34%;
            }
        }

        /* 📱 MOBILE */
        @media (max-width: 480px) {
            .glass-overlay {
                left: 58%;
                width: 36%;
            }
        }
    </style>
</head>

<body>

    <div class="smart-glass-container">

        <div class="scene">
            <!-- TA PHOTO -->
            <img src="./assets/images/gallery-finestre-vert-risparmio-energetico.jpg"
                alt="Intérieur maison avec baie vitrée">
            <div class="glass-overlay" id="glass"></div>
        </div>

        <div class="controls">
            <div class="temperature" id="tempValue">14°C</div>
            <input type="range" min="0" max="40" value="14" id="slider">
        </div>

    </div>

    <script>
        const slider = document.getElementById("slider");
        const glass = document.getElementById("glass");
        const tempValue = document.getElementById("tempValue");

        slider.addEventListener("input", () => {
            const temp = Number(slider.value);

            // Animation valeur température
            tempValue.style.transform = "translateY(-6px)";
            setTimeout(() => {
                tempValue.textContent = temp + "°C";
                tempValue.style.transform = "translateY(0)";
            }, 120);

            // 0 → 14°C : vitrage neutre
            if (temp <= 14) {
                glass.style.background = "rgba(0,120,200,0)";
                glass.style.backdropFilter = "blur(0px)";

        return;
            }

        // 14 → 40°C : smart glass progressif
        const progress = (temp - 14) / (40 - 14);

        const opacity = progress * 0.55;
        const blur = progress * 18;

        glass.style.background = `rgba(0,120,200,${opacity})`;
        glass.style.backdropFilter = `blur(${blur}px)`;
        });
    </script>


</body>

</html>
